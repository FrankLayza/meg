[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "milestone-guardian-memory"
version = "0.1.0"
description = "Sibyl-backed Guardian memory and decision workflow"
requires-python = ">=3.10"
dependencies = ["sibyl-memory-client"]

[project.optional-dependencies]
test = ["pytest>=8"]
llm = ["groq>=0.11"]

[project.scripts]
guardian-review = "guardian_memory.cli:main"

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.setuptools.packages.find]
where = ["src"]
